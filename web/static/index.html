<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>UCloud Cleaner</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>UCloud Cleaner</h1>
    <span class="queue-badge" id="queue-badge">队列: 0</span>
  </header>
  <main class="layout">
    <section class="panel form-panel">
      <h2>任务配置</h2>
      <label>账号
        <div class="account-row">
          <select id="account-select"></select>
          <button type="button" class="btn btn-sm btn-secondary" id="manage-accounts">管理账号</button>
        </div>
      </label>
      <div style="margin-bottom: 10px;">
        <button class="btn btn-sm btn-secondary" id="fetch-projects">获取项目</button>
        <span id="projects-msg" class="error-text" style="margin-left: 8px; display: inline;"></span>
      </div>

      <fieldset>
        <legend>项目</legend>
        <div class="select-bar">
          <button class="btn btn-sm btn-secondary" data-action="select-all" data-target="projects">全选</button>
          <button class="btn btn-sm btn-secondary" data-action="select-none" data-target="projects">取消选择</button>
        </div>
        <div id="projects" class="checkbox-grid"></div>
      </fieldset>

      <fieldset>
        <legend>区域</legend>
        <div class="select-bar">
          <button class="btn btn-sm btn-secondary" data-action="select-all" data-target="regions">全选</button>
          <button class="btn btn-sm btn-secondary" data-action="select-none" data-target="regions">取消选择</button>
        </div>
        <div id="regions" class="checkbox-grid"></div>
      </fieldset>

      <fieldset>
        <legend>资源类型</legend>
        <div class="select-bar">
          <button class="btn btn-sm btn-secondary" data-action="select-all" data-target="resources">全选</button>
          <button class="btn btn-sm btn-secondary" data-action="select-none" data-target="resources">取消选择</button>
        </div>
        <div id="resources" class="checkbox-grid"></div>
      </fieldset>

      <button id="submit-btn" class="btn btn-primary">开始清理</button>
      <p id="submit-error" class="error-text"></p>
    </section>

    <section class="panel runtime-panel">
      <!-- 常驻日志区：始终存在，默认展开 -->
      <div id="log-section" class="log-section">
        <div class="log-header" id="log-header">
          <span class="log-caret" id="log-caret">▾</span>
          <span class="log-title">运行日志</span>
          <span class="log-count" id="log-count">0 条</span>
          <div class="log-header-actions">
            <label><input type="checkbox" id="autoscroll" checked /> 自动滚动</label>
            <button class="btn btn-secondary btn-sm" id="clear-logs">清空日志</button>
          </div>
        </div>
        <div class="log-panel" id="log-panel"></div>
      </div>

      <h2>运行中</h2>
      <div id="running-block">
        <p class="empty-hint">暂无运行中的任务</p>
      </div>

      <h2>排队中 <span id="pending-count">(0)</span></h2>
      <div id="pending-list"></div>

      <h2>历史 <span id="history-count">(0)</span></h2>
      <div id="history-list"></div>
    </section>
  </main>

  <!-- 账号管理 -->
  <div id="account-modal" class="modal hidden">
    <div class="modal-box modal-page">
      <div id="account-list-view">
        <div class="modal-head">
          <h3>账号管理</h3>
          <button type="button" class="modal-close" id="account-modal-close">×</button>
        </div>
        <div class="modal-head-actions">
          <button type="button" class="btn btn-primary btn-sm" id="account-add">新增账号</button>
        </div>
        <table class="account-table">
          <thead>
            <tr><th>账号名称</th><th>环境</th><th>公钥</th><th>操作</th></tr>
          </thead>
          <tbody id="account-table-body"></tbody>
        </table>
        <p id="account-empty" class="empty-hint hidden">暂无账号，点击「新增账号」创建</p>
      </div>

      <div id="account-form-view" class="hidden">
        <div class="modal-head">
          <h3 id="account-form-title">新增账号</h3>
        </div>
        <form id="account-form" class="account-form">
          <label>账号名称 <span class="req">*</span>
            <input id="acc-name" placeholder="账号名称" autocomplete="off" />
          </label>
          <label>环境地址 <span class="req">*</span>
            <select id="acc-base-url">
              <option value="https://api.ucloud.cn">正式环境 · https://api.ucloud.cn</option>
              <option value="http://api-test03.ucloudadmin.com">测试环境 · http://api-test03.ucloudadmin.com</option>
            </select>
          </label>
          <label>公钥 <span class="req">*</span>
            <input id="acc-public-key" placeholder="公钥" autocomplete="off" />
          </label>
          <label>私钥 <span class="req">*</span>
            <input id="acc-private-key" placeholder="私钥" type="password" autocomplete="off" />
          </label>
          <div class="modal-actions">
            <button type="submit" class="btn btn-primary">保存账号</button>
            <button type="button" class="btn btn-secondary" id="acc-form-cancel">返回列表</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
